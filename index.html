*{box-sizing:border-box}
:root{--green:#174b31;--gold:#c9a12d;--bg:#eef3ef}
html,body{margin:0;background:var(--bg);font-family:"David Libre",David,serif;color:#173b2a}
.app{max-width:620px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 8px 26px rgba(0,0,0,.12)}

.note{font-size:13px;line-height:1.5;color:#56665d;margin-top:12px}

<script>
const FEMALE_BG="./certificate-female.webp";
const MALE_BG="./certificate-male.webp";

const canvas=document.getElementById("certificate");
const ctx=canvas.getContext("2d");
const imgs={female:new Image(),male:new Image()};
imgs.female.src=FEMALE_BG;
imgs.male.src=MALE_BG;

document.getElementById("date").valueAsDate=new Date();

function getSex(){return document.querySelector('input[name="sex"]:checked').value}
function v(id){return document.getElementById(id).value.trim()}
function fDate(x){if(!x)return"";const [y,m,d]=x.split("-");return `${d}/${m}/${y}`}

function drawTextRTL(text,x,y,maxWidth,size=22,align="right"){
  if(!text)return;
  ctx.save();
  ctx.direction="rtl";
  ctx.textAlign=align;
  ctx.textBaseline="middle";
  ctx.fillStyle="#174b31";
  ctx.font=`700 ${size}px "David Libre", David, serif`;
  while(ctx.measureText(text).width>maxWidth && size>14){
    size--;ctx.font=`700 ${size}px "David Libre", David, serif`;
  }
  ctx.fillText(text,x,y,maxWidth);
  ctx.restore();
}
function drawDate(text,x,y){
  ctx.save();
  ctx.direction="ltr";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillStyle="#174b31";
  ctx.font='500 18px "David Libre", David, serif';
  ctx.fillText(text,x,y);
  ctx.restore();
}
function drawValue(text,x,y,maxWidth,size=21){
  if(!text)return;
  ctx.save();
  ctx.direction="rtl";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillStyle="#174b31";
  ctx.font=`700 ${size}px "David Libre", David, serif`;
  while(ctx.measureText(text).width>maxWidth && size>14){
    size--;
    ctx.font=`700 ${size}px "David Libre", David, serif`;
  }
  ctx.fillText(text,x,y,maxWidth);
  ctx.restore();
}
async function redraw(){
  const img=imgs[getSex()];
  if(!img.complete) await new Promise(r=>img.onload=r);
  ctx.clearRect(0,0,1024,1448);
  ctx.drawImage(img,0,0,1024,1448);

  const d=fDate(document.getElementById("date").value);

  ctx.save();
  ctx.fillStyle="#fff";
  ctx.font='500 21px "David Libre", David, serif';
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(d,164,360);
  ctx.restore();

  // פרטי לקוח – הערכים נשארים משמאל לתוויות הקבועות
  drawTextRTL(v("owner"),815,389,205,21);
  drawTextRTL(v("sender"),815,423,205,21);

  // פרטי הנבדק – הערכים ממורכזים בעמודה השמאלית ללא מסכת רקע
  drawValue(v("birdType"),690,632,180,21);
  drawValue(v("idNumber"),690,687,180,21);
  drawValue(v("description"),690,744,180,21);

  // תאריכים בטבלת התוצאות – מוזזים שמאלה מהאייקון
  drawDate(d,548,928);
  drawDate(d,548,988);
}

["owner","sender","birdType","idNumber","description","date"].forEach(id=>{
  document.getElementById(id).addEventListener("input",redraw);
});
document.querySelectorAll('input[name="sex"]').forEach(el=>el.addEventListener("change",redraw));
imgs.female.onload=redraw;
imgs.male.onload=redraw;

function validate(){
  const ids=["owner","sender","birdType","idNumber","description","date"];
  if(ids.some(id=>!document.getElementById(id).value.trim())){
    alert("אנא מלא את כל השדות");
    return false;
  }
  return true;
}
function safeFilePart(text){
  return String(text || "")
    .trim()
    .replace(/[\\/:*?"<>|#%&{}$!'@+=`~]/g, "-")
    .replace(/\s+/g, " ")
    .replace(/-+/g, "-");
}

function buildCertificateFileName(){
  const result = getSex() === "male" ? "זכר" : "נקבה";
  return [
    safeFilePart(v("birdType")),
    safeFilePart(v("idNumber")),
    safeFilePart(v("description")),
    result
  ].filter(Boolean).join("-");
}

function dataUrlToBytes(dataUrl){
  const base64 = dataUrl.split(",")[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes;
}

function textBytes(text){
  return new TextEncoder().encode(text);
}

function concatBytes(parts){
  const total = parts.reduce((sum,p)=>sum+p.length,0);
  const out = new Uint8Array(total);
  let offset=0;
  for(const p of parts){ out.set(p,offset); offset+=p.length; }
  return out;
}

function makeSinglePagePdf(jpegBytes, imageWidth, imageHeight){
  // A4 portrait in PDF points.
  const pageW = 595.28;
  const pageH = 841.89;

  const objects = [];
  objects[1] = textBytes("<< /Type /Catalog /Pages 2 0 R >>");
  objects[2] = textBytes("<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  objects[3] = textBytes(
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] ` +
    `/Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>`
  );

  const content = textBytes(`q\n${pageW} 0 0 ${pageH} 0 0 cm\n/Im0 Do\nQ\n`);
  objects[4] = concatBytes([
    textBytes(`<< /Length ${content.length} >>\nstream\n`),
    content,
    textBytes("endstream")
  ]);

  objects[5] = concatBytes([
    textBytes(
      `<< /Type /XObject /Subtype /Image /Width ${imageWidth} /Height ${imageHeight} ` +
      `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`
    ),
    jpegBytes,
    textBytes("\nendstream")
  ]);

  const chunks = [textBytes("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n")];
  const offsets = [0];
  let position = chunks[0].length;

  for(let i=1;i<=5;i++){
    offsets[i] = position;
    const obj = concatBytes([
      textBytes(`${i} 0 obj\n`),
      objects[i],
      textBytes("\nendobj\n")
    ]);
    chunks.push(obj);
    position += obj.length;
  }

  const xrefOffset = position;
  let xref = "xref\n0 6\n0000000000 65535 f \n";
  for(let i=1;i<=5;i++){
    xref += String(offsets[i]).padStart(10,"0") + " 00000 n \n";
  }
  xref += `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
  chunks.push(textBytes(xref));

  return new Blob([concatBytes(chunks)], {type:"application/pdf"});
}


function wrapCanvasText(ctx, text, maxWidth){
  const words = String(text || "").split(/\s+/);
  const lines = [];
  let line = "";
  for(const word of words){
    const test = line ? line + " " + word : word;
    if(ctx.measureText(test).width > maxWidth && line){
      lines.push(line);
      line = word;
    }else{
      line = test;
    }
  }
  if(line) lines.push(line);
  return lines.length ? lines : [""];
}

async function shareOrDownloadPdf(pdfBlob, filename){
  const file = new File([pdfBlob], filename, {type:"application/pdf"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:filename});
      return;
    }catch(err){
      if(err && err.name === "AbortError") return;
    }
  }
  const url = URL.createObjectURL(pdfBlob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

let currentTablePdfName = "";

function makeMultiPagePdf(pageImages, pageWidth, pageHeight){
  const pageW = 841.89;
  const pageH = 595.28;
  const objects = {};
  let objNo = 1;

  const catalogNo = objNo++;
  const pagesNo = objNo++;
  const pageNos = [];
  const contentNos = [];
  const imageNos = [];

  for(let i=0;i<pageImages.length;i++){
    pageNos.push(objNo++);
    contentNos.push(objNo++);
    imageNos.push(objNo++);
  }

  objects[catalogNo] = textBytes(`<< /Type /Catalog /Pages ${pagesNo} 0 R >>`);
  objects[pagesNo] = textBytes(
    `<< /Type /Pages /Kids [${pageNos.map(n=>`${n} 0 R`).join(" ")}] /Count ${pageNos.length} >>`
  );

  for(let i=0;i<pageImages.length;i++){
    objects[pageNos[i]] = textBytes(
      `<< /Type /Page /Parent ${pagesNo} 0 R /MediaBox [0 0 ${pageW} ${pageH}] ` +
      `/Resources << /XObject << /Im${i} ${imageNos[i]} 0 R >> >> /Contents ${contentNos[i]} 0 R >>`
    );

    const content = textBytes(`q\n${pageW} 0 0 ${pageH} 0 0 cm\n/Im${i} Do\nQ\n`);
    objects[contentNos[i]] = concatBytes([
      textBytes(`<< /Length ${content.length} >>\nstream\n`),
      content,
      textBytes("endstream")
    ]);

    const jpg = pageImages[i];
    objects[imageNos[i]] = concatBytes([
      textBytes(
        `<< /Type /XObject /Subtype /Image /Width ${pageWidth} /Height ${pageHeight} ` +
        `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`
      ),
      jpg,
      textBytes("\nendstream")
    ]);
  }

  const chunks=[textBytes("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n")];
  const offsets=[0];
  let position=chunks[0].length;
  const maxObj=objNo-1;

  for(let i=1;i<=maxObj;i++){
    offsets[i]=position;
    const obj=concatBytes([textBytes(`${i} 0 obj\n`),objects[i],textBytes("\nendobj\n")]);
    chunks.push(obj);
    position+=obj.length;
  }

  const xrefOffset=position;
  let xref=`xref\n0 ${maxObj+1}\n0000000000 65535 f \n`;
  for(let i=1;i<=maxObj;i++){
    xref+=String(offsets[i]).padStart(10,"0")+" 00000 n \n";
  }
  xref+=`trailer\n<< /Size ${maxObj+1} /Root ${catalogNo} 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
  chunks.push(textBytes(xref));

  return new Blob([concatBytes(chunks)],{type:"application/pdf"});
}

function drawRoundedRect(ctx,x,y,w,h,r,fill,stroke){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.stroke();}
}

function fitText(ctx,text,maxWidth,startSize,minSize=16,weight=500){
  let size=startSize;
  do{
    ctx.font=`${weight} ${size}px "David Libre", David, serif`;
    if(ctx.measureText(String(text)).width<=maxWidth) break;
    size--;
  }while(size>minSize);
  return size;
}

async function createClientTablePdf(){
  const chosenDate=document.getElementById("date").value;
  const selectedCustomer=readJson(DB_KEYS.customers,[]).find(x=>x.id===clientSelect.value);
  const clientName=selectedCustomer?.name||v("sender");

  if(!chosenDate){alert("יש לבחור תאריך");return;}
  if(!clientName){alert("יש לבחור לקוח או למלא שם שולח");return;}

  if(validate()) saveCurrentRecord(false);

  const rows=readJson(DB_KEYS.history,[])
    .filter(r=>r.date===chosenDate&&r.client===clientName)
    .sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));

  if(!rows.length){alert("לא נמצאו תעודות שמורות ללקוח בתאריך שנבחר");return;}

  const maleCount=rows.filter(r=>r.result==="זכר").length;
  const femaleCount=rows.filter(r=>r.result==="נקבה").length;
  const reportNo=`${chosenDate.slice(0,4)}-${String(rows.length).padStart(4,"0")}`;

  const pageW=1754,pageH=1240;
  const rowsPerPage=15;
  const pages=[];
  const logo=await loadTableLogo().catch(()=>null);

  for(let pageIndex=0;pageIndex<Math.ceil(rows.length/rowsPerPage);pageIndex++){
    const slice=rows.slice(pageIndex*rowsPerPage,(pageIndex+1)*rowsPerPage);
    const c=document.createElement("canvas");
    c.width=pageW;c.height=pageH;
    const x=c.getContext("2d");
    x.fillStyle="#fff";x.fillRect(0,0,pageW,pageH);
    x.direction="rtl";x.textBaseline="middle";

    // Watermark
    if(logo){
      x.save();
      x.globalAlpha=0.055;
      const ratio=Math.min(720/logo.width,520/logo.height);
      const ww=logo.width*ratio,hh=logo.height*ratio;
      x.drawImage(logo,(pageW-ww)/2,(pageH-hh)/2+40,ww,hh);
      x.restore();
    }

    // Green/gold top ribbon
    x.fillStyle="#064c35";
    x.beginPath();x.moveTo(0,0);x.lineTo(680,0);x.quadraticCurveTo(500,70,0,115);x.closePath();x.fill();
    x.strokeStyle="#d5a72d";x.lineWidth=14;
    x.beginPath();x.moveTo(0,92);x.quadraticCurveTo(420,55,680,0);x.stroke();

    // Logo
    if(logo){
      const ratio=Math.min(390/logo.width,175/logo.height);
      const ww=logo.width*ratio,hh=logo.height*ratio;
      x.drawImage(logo,(pageW-ww)/2,20,ww,hh);
    }

    // Report number
    drawRoundedRect(x,1425,52,260,92,18,"#fff","#c59a28");
    x.fillStyle="#174b31";x.textAlign="center";
    x.font='700 22px "David Libre", David, serif';
    x.fillText("Report No.",1555,78);
    x.font='700 26px "David Libre", David, serif';
    x.fillText(reportNo,1555,112);

    // Title
    x.fillStyle="#064c35";x.textAlign="center";
    x.font='700 56px "David Libre", David, serif';
    x.fillText("בדיקות מין לתוכים",pageW/2,220);

    // Summary box
    drawRoundedRect(x,70,90,330,165,18,"#fff","#c59a28");
    x.textAlign="right";
    x.font='700 25px "David Libre", David, serif';
    x.fillStyle="#1746c7";x.fillText(`סה״כ זכרים: ${maleCount}`,360,125);
    x.fillStyle="#d02020";x.fillText(`סה״כ נקבות: ${femaleCount}`,360,175);
    x.fillStyle="#174b31";x.fillText(`סה״כ בדיקות: ${rows.length}`,360,225);

    // Client/date cards
    drawRoundedRect(x,1325,170,360,88,16,"#fff","#c59a28");
    x.textAlign="right";x.fillStyle="#174b31";
    x.font='700 24px "David Libre", David, serif';
    x.fillText(`לקוח: ${clientName}`,1650,214);

    drawRoundedRect(x,70,280,360,82,16,"#fff","#c59a28");
    x.textAlign="right";
    x.fillText(`תאריך: ${fDate(chosenDate)}`,395,321);

    // Table
    const left=70,top=390,tableWidth=1615,headerH=55,rowH=45;
    const colWidths=[85,350,360,500,320];
    const headers=["מס׳","סוג תוכי","תיאור","מס׳ זיהוי","מין"];

    drawRoundedRect(x,left,top,tableWidth,headerH,14,"#064c35","#064c35");
    let rightEdge=left+tableWidth;
    x.textAlign="center";x.fillStyle="#fff";
    x.font='700 26px "David Libre", David, serif';
    for(let i=0;i<headers.length;i++){
      const w=colWidths[i],x0=rightEdge-w;
      x.strokeStyle="rgba(255,255,255,.45)";x.strokeRect(x0,top,w,headerH);
      x.fillText(headers[i],x0+w/2,top+headerH/2);
      rightEdge=x0;
    }

    let y=top+headerH;
    slice.forEach((r,idx)=>{
      const globalIndex=pageIndex*rowsPerPage+idx+1;
      const values=[String(globalIndex),r.type||"",r.description||"",r.identification||"",r.result||""];
      x.fillStyle=idx%2===0?"#ffffff":"#f1f6f2";
      x.fillRect(left,y,tableWidth,rowH);
      x.strokeStyle="#c8d1ca";x.strokeRect(left,y,tableWidth,rowH);

      rightEdge=left+tableWidth;
      for(let i=0;i<values.length;i++){
        const w=colWidths[i],x0=rightEdge-w;
        x.strokeRect(x0,y,w,rowH);
        x.textAlign=(i===2||i===3)?"left":"center";
        x.fillStyle=i===4?(values[i]==="זכר"?"#1746c7":"#d02020"):"#111";
        const sz=fitText(x,values[i],w-22,i===4?23:22,15,i===4?700:500);
        x.font=`${i===4?700:500} ${sz}px "David Libre", David, serif`;
        const tx=(i===2||i===3)?x0+12:x0+w/2;
        x.fillText(values[i],tx,y+rowH/2,w-20);
        rightEdge=x0;
      }
      y+=rowH;
    });

    // Footer
    x.strokeStyle="#c59a28";x.lineWidth=2;
    x.beginPath();x.moveTo(70,1130);x.lineTo(1685,1130);x.stroke();
    x.textAlign="center";x.fillStyle="#174b31";
    x.font='500 22px "David Libre", David, serif';
    x.fillText("055-5710210",520,1170);
    x.fillText("LoriLab2025@gmail.com",930,1170);
    x.fillText("ישראל",1395,1170);
    x.fillStyle="#666";x.font='500 16px Arial';
    x.fillText("This summary is based on individual PCR reports issued by Lori Lab.",pageW/2,1205);
    x.textAlign="right";x.font='500 18px "David Libre", David, serif';
    x.fillText(`עמוד ${pageIndex+1} מתוך ${Math.ceil(rows.length/rowsPerPage)}`,1660,1205);

    pages.push(c);
  }

  const holder=document.getElementById("tablePreviewPages");
  holder.innerHTML="";
  pages.forEach(c=>holder.appendChild(c));

  const pageJpegs=pages.map(c=>dataUrlToBytes(c.toDataURL("image/jpeg",0.95)));
  currentTablePdfBlob=makeMultiPagePdf(pageJpegs,pageW,pageH);
  currentTablePdfName=`טבלה-${safeFilePart(clientName)}-${fDate(chosenDate).replaceAll("/","-")}.pdf`;

  document.getElementById("tablePreviewModal").classList.remove("hidden");
}

async function saveCurrentTablePdf(){
  if(!currentTablePdfBlob||!currentTablePdfName){
    alert("אין טבלה מוכנה לשמירה");return;
  }
  await shareOrDownloadPdf(currentTablePdfBlob,currentTablePdfName);
}

async function saveCertificatePdf(){
  if(!validate()) return;
  saveCurrentRecord(false);
  await redraw();

  const filename = buildCertificateFileName() + ".pdf";
  const jpegUrl = canvas.toDataURL("image/jpeg", 0.92);
  const jpegBytes = dataUrlToBytes(jpegUrl);
  const pdfBlob = makeSinglePagePdf(jpegBytes, canvas.width, canvas.height);

  await shareOrDownloadPdf(pdfBlob, filename);
}

async function printCertificate(){
  if(!validate()) return;
  await redraw();

  const originalTitle = document.title;
  const fileName = buildCertificateFileName();
  document.title = fileName;

  setTimeout(() => {
    window.print();
    setTimeout(() => {
      document.title = originalTitle;
    }, 1200);
  }, 250);
}
function saveForm(){
  const data={
    owner:v("owner"),sender:v("sender"),birdType:v("birdType"),
    idNumber:v("idNumber"),description:v("description"),
    date:document.getElementById("date").value,sex:getSex()
  };
  localStorage.setItem("loriLabForm",JSON.stringify(data));
  alert("הפרטים נשמרו בטלפון");
}
function loadForm(){
  const raw=localStorage.getItem("loriLabForm");
  if(!raw){alert("לא נמצאו פרטים שמורים");return}
  const d=JSON.parse(raw);
  ["owner","sender","birdType","idNumber","description"].forEach(id=>{
    document.getElementById(id).value=d[id]||"";
  });
  document.getElementById("date").value=d.date||"";
  const r=document.querySelector(`input[name="sex"][value="${d.sex||"female"}"]`);
  if(r)r.checked=true;
  redraw();
}
function clearForm(){
  ["owner","sender","birdType","idNumber","description"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("date").valueAsDate=new Date();
  document.querySelector('input[value="female"]').checked=true;
  redraw();
}
</script>
<script>
const DB_KEYS={customers:"loriLabCustomersV1",history:"loriLabHistoryV1"};
function readJson(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}}
function writeJson(k,v){localStorage.setItem(k,JSON.stringify(v))}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()}
function escapeHtml(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function seedCustomers(){if(readJson(DB_KEYS.customers,null))return;writeJson(DB_KEYS.customers,[
{id:uid(),city:"אעבלין",name:"רושדי",phone:"",email:"",notes:"",favorite:true},
{id:uid(),city:"אעבלין",name:"נדאר אבו גנימה",phone:"",email:"",notes:"",favorite:false},
{id:uid(),city:"אעבלין",name:"איהאב שיך אחמד",phone:"",email:"",notes:"",favorite:false},
{id:uid(),city:"אעבלין",name:"סאהר",phone:"",email:"",notes:"",favorite:true}] )}
function switchScreen(id){document.querySelectorAll(".screen").forEach(x=>x.classList.toggle("active",x.id===id));document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.screen===id));if(id==="customersScreen")renderCustomers();if(id==="historyScreen")renderHistory()}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>switchScreen(t.dataset.screen)))
function refreshSelectors(){const cs=readJson(DB_KEYS.customers,[]);const city=document.getElementById("citySelect"),client=document.getElementById("clientSelect");const cities=[...new Set(cs.map(c=>c.city).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"he"));city.innerHTML='<option value="">בחר עיר</option>'+cities.map(x=>`<option>${escapeHtml(x)}</option>`).join("");client.innerHTML='<option value="">בחר לקוח</option>'}
function loadClientsForCity(){const city=document.getElementById("citySelect").value;const cs=readJson(DB_KEYS.customers,[]).filter(c=>c.city===city).sort((a,b)=>(+b.favorite-+a.favorite)||a.name.localeCompare(b.name,"he"));document.getElementById("clientSelect").innerHTML='<option value="">בחר לקוח</option>'+cs.map(c=>`<option value="${c.id}">${c.favorite?"⭐ ":""}${escapeHtml(c.name)}</option>`).join("")}
function selectCustomer(){const c=readJson(DB_KEYS.customers,[]).find(x=>x.id===document.getElementById("clientSelect").value);if(!c)return;owner.value=c.name;sender.value=c.name;redraw()}
citySelect.addEventListener("change",loadClientsForCity);clientSelect.addEventListener("change",selectCustomer)
function openCustomerForm(id=""){const c=readJson(DB_KEYS.customers,[]).find(x=>x.id===id);customerFormCard.classList.remove("hidden");customerFormTitle.textContent=c?"עריכת לקוח":"לקוח חדש";customerId.value=c?.id||"";customerCity.value=c?.city||"";customerName.value=c?.name||"";customerPhone.value=c?.phone||"";customerEmail.value=c?.email||"";customerNotes.value=c?.notes||"";customerFavorite.checked=!!c?.favorite;customerFormCard.scrollIntoView({behavior:"smooth"})}
function closeCustomerForm(){customerFormCard.classList.add("hidden")}
function saveCustomer(){const city=customerCity.value.trim(),name=customerName.value.trim();if(!city||!name){alert("יש למלא עיר ושם לקוח");return}const id=customerId.value||uid(),list=readJson(DB_KEYS.customers,[]),item={id,city,name,phone:customerPhone.value.trim(),email:customerEmail.value.trim(),notes:customerNotes.value.trim(),favorite:customerFavorite.checked};const i=list.findIndex(x=>x.id===id);if(i>=0)list[i]=item;else list.push(item);writeJson(DB_KEYS.customers,list);closeCustomerForm();renderCustomers();refreshSelectors()}
function deleteCustomer(id){if(!confirm("למחוק את הלקוח?"))return;writeJson(DB_KEYS.customers,readJson(DB_KEYS.customers,[]).filter(x=>x.id!==id));renderCustomers();refreshSelectors()}
function renderCustomers(){const q=(customerSearch.value||"").trim().toLowerCase(),list=readJson(DB_KEYS.customers,[]).filter(c=>(c.city+" "+c.name).toLowerCase().includes(q)).sort((a,b)=>(+b.favorite-+a.favorite)||a.city.localeCompare(b.city,"he")||a.name.localeCompare(b.name,"he"));customersList.innerHTML=list.length?list.map(c=>`<div class="list-item"><div class="list-title">${c.favorite?"⭐ ":""}${escapeHtml(c.name)}</div><div class="list-sub">עיר: ${escapeHtml(c.city)}${c.phone?` · ${escapeHtml(c.phone)}`:""}</div><div class="list-actions"><button class="secondary" onclick="openCustomerForm('${c.id}')">עריכה</button><button class="secondary" onclick="deleteCustomer('${c.id}')">מחיקה</button></div></div>`).join(""):'<div class="empty">לא נמצאו לקוחות</div>'}
function currentRecord(){
  const c=readJson(DB_KEYS.customers,[]).find(x=>x.id===clientSelect.value);
  return {
    id:uid(),
    date:date.value,
    city:citySelect.value,
    client:c?.name||v("sender"),
    type:v("birdType"),
    identification:v("idNumber"),
    description:v("description"),
    result:getSex()==="male"?"זכר":"נקבה",
    createdAt:new Date().toISOString()
  };
}
function saveCurrentRecord(showMessage=true){
  if(!validate()) return false;
  const r=currentRecord();
  const list=readJson(DB_KEYS.history,[]);
  const duplicate=list.some(x =>
    x.date===r.date &&
    x.client===r.client &&
    x.identification===r.identification &&
    x.type===r.type &&
    x.description===r.description &&
    x.result===r.result
  );
  if(!duplicate){
    list.unshift(r);
    writeJson(DB_KEYS.history,list);
  }
  if(showMessage) alert(duplicate ? "הרשומה כבר קיימת" : "הרשומה נשמרה בטלפון");
  return true;
}
function saveRecord(){ saveCurrentRecord(true); }
function renderHistory(){const q=(historySearch.value||"").trim().toLowerCase(),list=readJson(DB_KEYS.history,[]).filter(r=>[r.client,r.city,r.type,r.identification,r.description,r.result,r.date].join(" ").toLowerCase().includes(q));historyList.innerHTML=list.length?list.map(r=>`<div class="list-item"><div class="list-title">${escapeHtml(r.identification)} · ${escapeHtml(r.result)}</div><div class="list-sub">${escapeHtml(r.client)} · ${escapeHtml(r.city||"")} · ${escapeHtml(r.type)} · ${escapeHtml(r.date)}</div><div class="list-sub">${escapeHtml(r.description||"")}</div></div>`).join(""):'<div class="empty">אין עדיין רשומות</div>'}
function exportHistoryCsv(){const rows=readJson(DB_KEYS.history,[]);if(!rows.length){alert("אין רשומות לייצוא");return}const all=[["תאריך","לקוח","עיר","סוג","מספר זיהוי","תיאור","תוצאה"],...rows.map(r=>[r.date,r.client,r.city,r.type,r.identification,r.description,r.result])],csv="\ufeff"+all.map(row=>row.map(x=>`"${String(x??"").replaceAll('"','""')}"`).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="LoriLab-results.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
seedCustomers();refreshSelectors();redraw();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(console.error);
  });
}
</script>
