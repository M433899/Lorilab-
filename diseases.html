<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lori Lab Certificate Studio</title>
<style>
:root{--green:#073f2e;--gold:#d6a314;--bg:#e9eeeb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans Hebrew",sans-serif;color:#111}
.app{
  max-width:1100px;margin:12px auto;padding:14px;background:#fff;border-radius:16px;
  box-shadow:0 8px 28px rgba(0,0,0,.12);display:grid;grid-template-columns:repeat(3,1fr);gap:10px
}
.app label{display:block;font-size:12px;font-weight:700;color:var(--green);margin-bottom:4px}
.app input,.app select{
  width:100%;height:41px;border:1px solid #cbd5d0;border-radius:8px;padding:0 10px;font-size:14px;background:#fff
}
.actions{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
button{border:0;border-radius:8px;padding:11px 17px;font-weight:700;cursor:pointer}
.primary{background:var(--green);color:#fff}
.secondary{background:#f2e7c9;color:var(--green)}
.preview{display:flex;justify-content:center;padding:0 10px 28px}
.paper{
  width:210mm;height:297mm;background:#fff;box-shadow:0 15px 35px rgba(0,0,0,.16);
  display:flex;align-items:center;justify-content:center;overflow:hidden
}
canvas{width:100%;height:100%;display:block}
@media(max-width:900px){.app{grid-template-columns:1fr 1fr;margin:8px}.paper{width:100%;height:auto;aspect-ratio:210/297}}
@media(max-width:560px){.app{grid-template-columns:1fr}}
@media print{
  body{background:#fff}
  .app{display:none}
  .preview{padding:0}
  .paper{width:210mm;height:297mm;box-shadow:none}
  @page{size:A4;margin:0}
}
</style>
</head>
<body>

<section class="app">
  <div><label>שם הבעלים</label><input id="owner" value="אביאל"></div>
  <div><label>שם השולח</label><input id="sender" value="ממלכת הציפורים"></div>
  <div><label>תאריך</label><input id="date" type="date" value="2026-07-24"></div>

  <div><label>סוג בעל הכנף</label><input id="species" value="ג'אקו אפריקאי (African Grey)"></div>
  <div><label>מספר זיהוי</label><input id="birdId" value="2026/23"></div>
  <div><label>תיאור</label><input id="desc" value='דגימת נוצות ודנ"א'></div>

  <div><label>זיהוי מין</label>
    <select id="sex"><option>נקבה</option><option>זכר</option><option>לא נבדק</option></select>
  </div>
  <div><label>PBFD</label>
    <select id="pbfd"><option>שלילי</option><option>חיובי</option><option>לא נבדק</option></select>
  </div>
  <div><label>Polyomavirus</label>
    <select id="poly"><option>שלילי</option><option>חיובי</option><option>לא נבדק</option></select>
  </div>
  <div><label>Chlamydia psittaci</label>
    <select id="chlamydia"><option>שלילי</option><option>חיובי</option><option>לא נבדק</option></select>
  </div>

  <div class="actions">
    <button class="primary" onclick="printCertificate()">הדפס / שמור PDF</button>
    <button class="secondary" onclick="downloadPNG()">שמור כתמונה</button>
    <button class="secondary" onclick="resetForm()">נקה טופס</button>
  </div>
</section>

<div class="preview">
  <div class="paper">
    <canvas id="certificate" width="1024" height="1536"></canvas>
  </div>
</div>

const canvas = document.getElementById("certificate");
const ctx = canvas.getContext("2d");

function fmtDate(v){
  if(!v) return "";
  const [y,m,d]=v.split("-");
  return `${d}/${m}/${y}`;
}
function roundedRect(x,y,w,h,r,fill){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  ctx.fillStyle=fill; ctx.fill();
}
function clearBox(x,y,w,h){ctx.fillStyle="#fff";ctx.fillRect(x,y,w,h)}
function text(txt,x,y,size,color="#111",weight="400",align="center"){
  ctx.save();
  ctx.direction="rtl";
  ctx.textAlign=align;
  ctx.textBaseline="middle";
  ctx.font=`${weight} ${size}px Arial`;
  ctx.fillStyle=color;
  ctx.fillText(txt||"",x,y);
  ctx.restore();
}
function fitText(txt,x,y,maxWidth,size,color="#111",weight="400"){
  let s=size;
  ctx.save();
  ctx.direction="rtl";ctx.textAlign="center";ctx.textBaseline="middle";
  while(s>11){
    ctx.font=`${weight} ${s}px Arial`;
    if(ctx.measureText(txt||"").width<=maxWidth) break;
    s--;
  }
  ctx.fillStyle=color;ctx.fillText(txt||"",x,y);
  ctx.restore();
}
function rowResult(value){
  if(value==="חיובי") return ["#b51f2f","חיובי"];
  if(value==="נקבה") return ["#d71973","נקבה"];
  if(value==="זכר") return ["#1769aa","זכר"];
  return ["#0b4a35",value];
}
function draw(){
  if(!bg.complete) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(bg,0,0,1024,1536);

  const d=fmtDate(document.getElementById("date").value);

  // Replace variable areas cleanly.
  // Date pill — rebuild the complete badge so the icon and date are sharp.
  clearBox(28,338,330,88);
  roundedRect(35,347,292,67,32,"#0a4b35");
  roundedRect(35,347,76,67,32,"#063728");

  // Vector calendar icon
  ctx.save();
  ctx.strokeStyle="#fff";
  ctx.fillStyle="#fff";
  ctx.lineWidth=4;
  ctx.lineCap="round";
  ctx.lineJoin="round";
  ctx.strokeRect(57,365,34,31);
  ctx.beginPath();
  ctx.moveTo(57,375); ctx.lineTo(91,375);
  ctx.moveTo(65,359); ctx.lineTo(65,369);
  ctx.moveTo(83,359); ctx.lineTo(83,369);
  ctx.stroke();
  [[66,382],[75,382],[84,382],[66,390],[75,390],[84,390]].forEach(([x,y])=>{
    ctx.beginPath(); ctx.arc(x,y,2.2,0,Math.PI*2); ctx.fill();
  });
  ctx.restore();
  text(d,218,381,20,"#fff","700");

  // Owner and sender — rebuild the complete block cleanly.
  clearBox(690,332,300,160);

  // Recipient heading
  text("לכבוד",932,370,23,"#0a4b35","700","right");

  // Simple recipient icon
  ctx.save();
  ctx.strokeStyle="#0a4b35";
  ctx.lineWidth=2.4;
  ctx.beginPath();
  ctx.arc(971,352,9,0,Math.PI*2);
  ctx.moveTo(955,379);
  ctx.quadraticCurveTo(971,363,987,379);
  ctx.stroke();
  ctx.restore();

  // Labels and values
  text("שם הבעלים:",936,414,18,"#111","700","right");
  fitText(document.getElementById("owner").value,790,414,150,19,"#111","400");

  text("שם השולח:",936,462,18,"#111","700","right");
  fitText(document.getElementById("sender").value,766,462,174,19,"#111","400");

  // Subject card — redraw the complete card, frame, header, separators and icons.
  clearBox(535,470,470,325);

  // Complete rounded white card
  roundedRect(552,505,438,275,24,"#fff");
  ctx.save();
  ctx.strokeStyle="#cfd5d1";
  ctx.lineWidth=1.6;
  ctx.beginPath();
  ctx.moveTo(576,505);
  ctx.lineTo(966,505);
  ctx.arcTo(990,505,990,529,24);
  ctx.lineTo(990,756);
  ctx.arcTo(990,780,966,780,24);
  ctx.lineTo(576,780);
  ctx.arcTo(552,780,552,756,24);
  ctx.lineTo(552,529);
  ctx.arcTo(552,505,576,505,24);
  ctx.closePath();
  ctx.stroke();

  // Right icon column and row separators
  ctx.strokeStyle="#e0e4e1";
  ctx.lineWidth=1.2;
  ctx.beginPath();
  ctx.moveTo(895,525); ctx.lineTo(895,760);
  ctx.moveTo(570,595); ctx.lineTo(972,595);
  ctx.moveTo(570,685); ctx.lineTo(972,685);
  ctx.stroke();
  ctx.restore();

  // Green title badge
  roundedRect(650,480,285,56,28,"#064b35");
  text("פרטי הנבדק",786,508,24,"#fff","700");

  // Bird silhouette in header
  ctx.save();
  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.ellipse(908,500,8,13,-0.25,0,Math.PI*2);
  ctx.moveTo(903,510); ctx.lineTo(897,525); ctx.lineTo(907,519);
  ctx.lineTo(916,526); ctx.lineTo(913,509);
  ctx.moveTo(912,491); ctx.lineTo(920,487); ctx.lineTo(914,497);
  ctx.fill();
  ctx.restore();

  // Labels and values
  text("סוג:",868,563,18,"#111","700","right");
  fitText(document.getElementById("species").value,710,563,260,20,"#111","400");

  text("מספר זיהוי:",868,640,18,"#111","700","right");
  fitText(document.getElementById("birdId").value,710,640,225,20,"#111","400");

  text("תיאור:",868,730,18,"#111","700","right");
  fitText(document.getElementById("desc").value,710,730,260,20,"#111","400");

  // Feather icon
  ctx.save();
  ctx.strokeStyle="#0b2e22";
  ctx.lineWidth=2.2;
  ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(938,570); ctx.quadraticCurveTo(960,540,967,548);
  ctx.quadraticCurveTo(971,560,941,582);
  ctx.moveTo(940,581); ctx.lineTo(961,552);
  ctx.moveTo(948,570); ctx.lineTo(956,570);
  ctx.moveTo(953,562); ctx.lineTo(962,561);
  ctx.stroke();

  // Barcode icon
  [0,4,8,13,18,23,28,33].forEach((dx,i)=>{
    ctx.lineWidth = i%3===0 ? 3 : 1.8;
    ctx.beginPath();
    ctx.moveTo(928+dx,620);
    ctx.lineTo(928+dx,658);
    ctx.stroke();
  });

  // Document icon
  ctx.lineWidth=2.2;
  ctx.beginPath();
  ctx.moveTo(932,706); ctx.lineTo(956,706);
  ctx.lineTo(968,718); ctx.lineTo(968,755);
  ctx.lineTo(932,755); ctx.closePath();
  ctx.moveTo(956,706); ctx.lineTo(956,719); ctx.lineTo(968,719);
  ctx.moveTo(940,730); ctx.lineTo(960,730);
  ctx.moveTo(940,738); ctx.lineTo(960,738);
  ctx.moveTo(940,746); ctx.lineTo(954,746);
  ctx.stroke();
  ctx.restore();

  // Rebuild the whole result table body to avoid duplicated text.
  const tests=[
    ["הפקת DNA","תקין","A0"],
    ["זיהוי מין (PCR)",document.getElementById("sex").value,"A6"],
    ["PBFD",document.getElementById("pbfd").value,"F10"],
    ["Polyomavirus",document.getElementById("poly").value,"F20"],
    ["Chlamydia psittaci",document.getElementById("chlamydia").value,"F30"]
  ].filter(t=>t[1]!=="לא נבדק");

  // Table body area
  clearBox(38,914,936,292);
  const left=38, top=914, width=936, rowH=58;
  const cols=[0,220,454,696,936];
  ctx.strokeStyle="#cfd5d1";ctx.lineWidth=1;
  for(let i=0;i<=tests.length;i++){
    ctx.beginPath();ctx.moveTo(left,top+i*rowH);ctx.lineTo(left+width,top+i*rowH);ctx.stroke();
  }
  for(let c=1;c<cols.length-1;c++){
    ctx.beginPath();ctx.moveTo(left+cols[c],top);ctx.lineTo(left+cols[c],top+tests.length*rowH);ctx.stroke();
  }

  tests.forEach((t,i)=>{
    const y=top+i*rowH+rowH/2;
    text(t[2],left+110,y,18,"#111","400");
    const [color,label]=rowResult(t[1]);
    text(label,left+337,y,18,color,"700");
    text(d,left+575,y,17,"#111","400");
    fitText(t[0],left+816,y,215,17,"#111","400");
  });

  // General notes — replace the blurred background wording with sharp text.
  clearBox(112,1220,815,132);
  text("הערות כלליות",894,1244,20,"#111","700","right");

  const notes = [
    'אבחון מין ומחלות בציפורים נעשה ע"י ריאקציית PCR. אמינות פרוטוקול מעבדתי הינה 99.9%.',
    'פרטי הנבדק נרשמים בהתאם לפרטים שנמסרו ולא ניתן לשנותם.',
    'תוצאות הבדיקה נשלחות לשולח בלבד.'
  ];

  ctx.save();
  ctx.fillStyle="#111";
  ctx.font='600 15px Arial, "Noto Sans Hebrew", sans-serif';
  ctx.textAlign="right";
  ctx.textBaseline="middle";
  ctx.direction="rtl";

  notes.forEach((note,index)=>{
    const y=1275+(index*31);
    ctx.beginPath();
    ctx.arc(905,y,3.1,0,Math.PI*2);
    ctx.fill();
    ctx.fillText(note,875,y);
  });
  ctx.restore();
}
bg.onload=draw;
document.querySelectorAll("input,select").forEach(el=>el.addEventListener("input",draw));

function printCertificate(){
  draw();
  setTimeout(()=>window.print(),100);
}
function downloadPNG(){
  draw();
