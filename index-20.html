<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=David+Libre:wght@400;500;700&display=swap');
*{box-sizing:border-box}
:root{--green:#174b31;--gold:#c9a12d;--bg:#eef3ef}
html,body{margin:0;background:var(--bg);font-family:"David Libre",David,serif;color:#173b2a}
.app{max-width:620px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 8px 26px rgba(0,0,0,.12)}
h1{margin:0 0 18px;text-align:center;font-size:24px;color:var(--green);border-bottom:3px solid var(--gold);padding-bottom:11px}
.field{margin-bottom:12px}
label{display:block;font-weight:700;margin-bottom:6px}
input,textarea{width:100%;border:1px solid #b8c6bd;border-radius:10px;padding:12px;font-size:17px;font-family:"David Libre",David,serif;background:#fff}
textarea{min-height:72px;resize:vertical}
.sex{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sex label{margin:0;border:2px solid #d1dbd4;border-radius:10px;padding:12px;text-align:center;font-size:18px}
.sex input{width:auto;margin-left:6px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
button{border:0;border-radius:10px;padding:14px;font-size:17px;font-weight:700;cursor:pointer}
.primary{background:var(--green);color:#fff}
.secondary{background:#e7efe9;color:var(--green)}
.preview-card{margin-top:14px;background:#dde6df;border-radius:14px;padding:8px;overflow:auto}
canvas{display:block;width:100%;height:auto;background:white;box-shadow:0 6px 20px rgba(0,0,0,.14)}
.note{font-size:13px;line-height:1.5;color:#56665d;margin-top:12px}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .app>.card,.note{display:none!important}
  .app{max-width:none;padding:0;margin:0}
  .preview-card{margin:0;padding:0;background:#fff;border-radius:0;overflow:visible}
  canvas{width:210mm!important;height:297mm!important;box-shadow:none!important}
}

.topbar{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,.1)}
.topbar h1{margin:0 0 4px;text-align:center;color:var(--green);font-size:28px}
.version-badge{text-align:center;font:700 13px Arial,sans-serif;color:#7b6a2e;margin-bottom:12px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tab{background:#e8efe9;color:var(--green);padding:10px 6px;font-size:15px}
.tab.active{background:var(--green);color:#fff}
.screen{display:none}
.screen.active{display:block}
.diseases-card{padding:10px}
.diseases-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.diseases-frame{width:100%;height:82vh;min-height:720px;border:1px solid #cbd8cf;border-radius:12px;background:#fff}
@media(max-width:480px){.diseases-frame{height:78vh;min-height:620px}}

h2{margin:0 0 14px;color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select{width:100%;border:1px solid #b8c6bd;border-radius:10px;padding:12px;font-size:17px;font-family:"David Libre",David,serif;background:#fff}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.small{padding:9px 12px;font-size:14px}
.hidden{display:none!important}
.list{margin-top:12px;display:grid;gap:10px}
.list-item{border:1px solid #d5dfd8;border-radius:12px;padding:12px;background:#fafcfb}
.list-title{font-size:19px;font-weight:700;color:var(--green)}
.list-sub{font-size:14px;color:#657268;margin-top:4px}
.list-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

<script>
const FEMALE_BG="./certificate-female.webp";
const MALE_BG="./certificate-male.webp";

const canvas=document.getElementById("certificate");
const ctx=canvas.getContext("2d");
const imgs={female:new Image(),male:new Image()};
imgs.female.src=FEMALE_BG;
imgs.male.src=MALE_BG;

document.getElementById("date").valueAsDate=new Date();

function getSex(){return document.querySelector('input[name="sex"]:checked').value}
function v(id){return document.getElementById(id).value.trim()}
function fDate(x){if(!x)return"";const [y,m,d]=x.split("-");return `${d}/${m}/${y}`}

function drawTextRTL(text,x,y,maxWidth,size=22,align="right"){
  if(!text)return;
  ctx.save();
  ctx.direction="rtl";
  ctx.textAlign=align;
  ctx.textBaseline="middle";
  ctx.fillStyle="#174b31";
  ctx.font=`700 ${size}px "David Libre", David, serif`;
  while(ctx.measureText(text).width>maxWidth && size>14){
    size--;ctx.font=`700 ${size}px "David Libre", David, serif`;
  }
  ctx.fillText(text,x,y,maxWidth);
  ctx.restore();
}
function drawDate(text,x,y){
  ctx.save();
  ctx.direction="ltr";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillStyle="#174b31";
  ctx.font='500 18px "David Libre", David, serif';
  ctx.fillText(text,x,y);
  ctx.restore();
}
function drawValue(text,x,y,maxWidth,size=21){
  if(!text)return;
  ctx.save();
  ctx.direction="rtl";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillStyle="#174b31";
  ctx.font=`700 ${size}px "David Libre", David, serif`;
  while(ctx.measureText(text).width>maxWidth && size>14){
    size--;
    ctx.font=`700 ${size}px "David Libre", David, serif`;
  }
  ctx.fillText(text,x,y,maxWidth);
  ctx.restore();
}
async function redraw(){
  const img=imgs[getSex()];
  if(!img.complete) await new Promise(r=>img.onload=r);
  ctx.clearRect(0,0,1024,1448);
  ctx.drawImage(img,0,0,1024,1448);

  const d=fDate(document.getElementById("date").value);

  ctx.save();
  ctx.fillStyle="#fff";
  ctx.font='500 21px "David Libre", David, serif';
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(d,164,360);
  ctx.restore();

  // פרטי לקוח – הערכים נשארים משמאל לתוויות הקבועות
  drawTextRTL(v("owner"),815,389,205,21);
  drawTextRTL(v("sender"),815,423,205,21);

  // פרטי הנבדק – הערכים ממורכזים בעמודה השמאלית ללא מסכת רקע
  drawValue(v("birdType"),690,632,180,21);
  drawValue(v("idNumber"),690,687,180,21);
  drawValue(v("description"),690,744,180,21);

  // תאריכים בטבלת התוצאות – מוזזים שמאלה מהאייקון
  drawDate(d,548,928);
  drawDate(d,548,988);
}

["owner","sender","birdType","idNumber","description","date"].forEach(id=>{
  document.getElementById(id).addEventListener("input",redraw);
});
document.querySelectorAll('input[name="sex"]').forEach(el=>el.addEventListener("change",redraw));
imgs.female.onload=redraw;
imgs.male.onload=redraw;

function validate(){
  // שדות התעודה אינם שדות חובה. ניתן להפיק תעודה גם כשחלק מהמידע אינו ידוע.
  return true;
}

function hasCurrentTestData(){
  return ["birdType","idNumber","description"].some(id=>v(id));
}
function safeFilePart(text){
  return String(text || "")
    .normalize("NFC")
    .trim()
    // גרש וגרשיים בתוך שמות עבריים עלולים להשתבש בשם הקובץ באנדרואיד.
    // גרסה v11.1: הלוכסן / נשאר כפי שהוקלד כדי לבדוק את התנהגות Chrome ו-Drive.
    .replace(/[\'׳״“”‘’]/g, "")
    .replace(/[:*?"<>|#%&{}$!@+=`~]/g, " ")
    .replace(/[‎‏‪-‮⁦-⁩]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function buildCertificateFileName(){
  const result = getSex() === "male" ? "זכר" : "נקבה";
  const birdType = safeFilePart(v("birdType"));
  const description = safeFilePart(v("description"));
  const idNumber = safeFilePart(v("idNumber"));
  const details = [description, idNumber].filter(Boolean).join(" ");

  if (birdType && details) return `${birdType} (${details}) ${result}`;
  if (birdType) return `${birdType} ${result}`;
  if (details) return `תעודה (${details}) ${result}`;
  return `תעודה ${result}`;
}

function dataUrlToBytes(dataUrl){
  const base64 = dataUrl.split(",")[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes;
}

function textBytes(text){
  return new TextEncoder().encode(text);
}

function concatBytes(parts){
  const total = parts.reduce((sum,p)=>sum+p.length,0);
  const out = new Uint8Array(total);
  let offset=0;
  for(const p of parts){ out.set(p,offset); offset+=p.length; }
  return out;
}

function makeSinglePagePdf(jpegBytes, imageWidth, imageHeight){
  // A4 portrait in PDF points.
  const pageW = 595.28;
  const pageH = 841.89;

  const objects = [];
  objects[1] = textBytes("<< /Type /Catalog /Pages 2 0 R >>");
  objects[2] = textBytes("<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  objects[3] = textBytes(
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] ` +
    `/Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>`
  );

  const content = textBytes(`q\n${pageW} 0 0 ${pageH} 0 0 cm\n/Im0 Do\nQ\n`);
  objects[4] = concatBytes([
    textBytes(`<< /Length ${content.length} >>\nstream\n`),
    content,
    textBytes("endstream")
  ]);

  objects[5] = concatBytes([
    textBytes(
      `<< /Type /XObject /Subtype /Image /Width ${imageWidth} /Height ${imageHeight} ` +
      `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`
    ),
    jpegBytes,
    textBytes("\nendstream")
  ]);

  const chunks = [textBytes("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n")];
  const offsets = [0];
  let position = chunks[0].length;

  for(let i=1;i<=5;i++){
    offsets[i] = position;
    const obj = concatBytes([
      textBytes(`${i} 0 obj\n`),
      objects[i],
      textBytes("\nendobj\n")
    ]);
    chunks.push(obj);
    position += obj.length;
  }

  const xrefOffset = position;
  let xref = "xref\n0 6\n0000000000 65535 f \n";
  for(let i=1;i<=5;i++){
    xref += String(offsets[i]).padStart(10,"0") + " 00000 n \n";
  }
  xref += `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
  chunks.push(textBytes(xref));

  return new Blob([concatBytes(chunks)], {type:"application/pdf"});
}


function wrapCanvasText(ctx, text, maxWidth){
  const words = String(text || "").split(/\s+/);
  const lines = [];
  let line = "";
  for(const word of words){
    const test = line ? line + " " + word : word;
    if(ctx.measureText(test).width > maxWidth && line){
      lines.push(line);
      line = word;
    }else{
      line = test;
    }
  }
  if(line) lines.push(line);
  return lines.length ? lines : [""];
}

async function shareOrDownloadPdf(pdfBlob, filename){
  const file = new File([pdfBlob], filename, {type:"application/pdf"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:filename});
      return;
    }catch(err){
      if(err && err.name === "AbortError") return;
    }
  }
  const url = URL.createObjectURL(pdfBlob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}



let currentTablePdfBlob = null;
let currentTablePdfName = "";

function closeTablePreview(){
  document.getElementById("tablePreviewModal").classList.add("hidden");
  document.body.style.overflow="";
}

async function loadTableLogo(){
  return await new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload=async()=>{try{if(img.decode)await img.decode()}catch(e){} resolve(img)};
    img.onerror=reject;
    img.src="./table-logo.webp";
  });
}

function makeMultiPagePdf(pageImages, pageWidth, pageHeight){
  // A4 לאורך (Portrait) — לא רוחב.
  const pageW = 595.28;
  const pageH = 841.89;
  const objects = {};
  let objNo = 1;

  const catalogNo = objNo++;
  const pagesNo = objNo++;
  const pageNos = [];
  const contentNos = [];
  const imageNos = [];

  for(let i=0;i<pageImages.length;i++){
    pageNos.push(objNo++);
    contentNos.push(objNo++);
    imageNos.push(objNo++);
  }

  objects[catalogNo] = textBytes(`<< /Type /Catalog /Pages ${pagesNo} 0 R >>`);
  objects[pagesNo] = textBytes(
    `<< /Type /Pages /Kids [${pageNos.map(n=>`${n} 0 R`).join(" ")}] /Count ${pageNos.length} >>`
  );

  for(let i=0;i<pageImages.length;i++){
    objects[pageNos[i]] = textBytes(
      `<< /Type /Page /Parent ${pagesNo} 0 R /MediaBox [0 0 ${pageW} ${pageH}] ` +
      `/Resources << /XObject << /Im${i} ${imageNos[i]} 0 R >> >> /Contents ${contentNos[i]} 0 R >>`
    );

    const content = textBytes(`q\n${pageW} 0 0 ${pageH} 0 0 cm\n/Im${i} Do\nQ\n`);
    objects[contentNos[i]] = concatBytes([
      textBytes(`<< /Length ${content.length} >>\nstream\n`),
      content,
      textBytes("endstream")
    ]);

    const jpg = pageImages[i];
    objects[imageNos[i]] = concatBytes([
      textBytes(
        `<< /Type /XObject /Subtype /Image /Width ${pageWidth} /Height ${pageHeight} ` +
        `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`
      ),
      jpg,
      textBytes("\nendstream")
    ]);
  }

  const chunks=[textBytes("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n")];
  const offsets=[0];
  let position=chunks[0].length;
  const maxObj=objNo-1;

  for(let i=1;i<=maxObj;i++){
    offsets[i]=position;
    const obj=concatBytes([textBytes(`${i} 0 obj\n`),objects[i],textBytes("\nendobj\n")]);
    chunks.push(obj);
    position+=obj.length;
  }

  const xrefOffset=position;
  let xref=`xref\n0 ${maxObj+1}\n0000000000 65535 f \n`;
  for(let i=1;i<=maxObj;i++){
    xref+=String(offsets[i]).padStart(10,"0")+" 00000 n \n";
  }
  xref+=`trailer\n<< /Size ${maxObj+1} /Root ${catalogNo} 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
  chunks.push(textBytes(xref));

  return new Blob([concatBytes(chunks)],{type:"application/pdf"});
}

function drawRoundedRect(ctx,x,y,w,h,r,fill,stroke){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.stroke();}
}

function fitText(ctx,text,maxWidth,startSize,minSize=16,weight=500){
  let size=startSize;
  do{
    ctx.font=`${weight} ${size}px "David Libre", David, serif`;
    if(ctx.measureText(String(text)).width<=maxWidth) break;
    size--;
  }while(size>minSize);
  return size;
}

async function saveCertificatePdf(){

  const jpegUrl = canvas.toDataURL("image/jpeg", 0.98);

  const pdfBlob = makeSinglePagePdf(jpegBytes, canvas.width, canvas.height);

  const selectedCustomer = readJson(DB_KEYS.customers,[]).find(x=>x.id===clientSelect.value);
  const city = (selectedCustomer?.city || citySelect.value || "").trim();
  const client = (selectedCustomer?.name || v("sender") || v("owner") || "").trim();
  const certificateDate = date.value;
  const cfg = getDriveConfig();

  if(city && client && certificateDate && cfg.rootFolderId){
    try{
      setDriveStatus("שומר את התעודה אוטומטית ב־Google Drive…");
      await uploadCertificateToDrive(pdfBlob, filename, city, client, certificateDate, selectedCustomer);
      setDriveStatus(`נשמר ב־Drive: ${city} ← ${client} ← ${fDate(certificateDate)}`);
      alert(`התעודה נשמרה בהצלחה ב־Google Drive\n${city} ← ${client} ← ${fDate(certificateDate)}`);
      return;
    }catch(err){
      console.error(err);
      setDriveStatus(err.message || "השמירה ב־Drive נכשלה", true);
      if(!confirm("השמירה האוטומטית ב־Google Drive נכשלה. לשמור את ה־PDF בטלפון במקום?")) return;
    }
  }

  await shareOrDownloadPdf(pdfBlob, filename);
}

function exportHistoryCsv(){const rows=readJson(DB_KEYS.history,[]);if(!rows.length){alert("אין רשומות לייצוא");return}const all=[["תאריך","לקוח","עיר","סוג","מספר זיהוי","תיאור","תוצאה"],...rows.map(r=>[r.date,r.client,r.city,r.type,r.identification,r.description,r.result])],csv="\ufeff"+all.map(row=>row.map(x=>`"${String(x??"").replaceAll('"','""')}"`).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="LoriLab-results.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}

const DRIVE_CFG_KEY="loriLabDriveConfigV1";
let driveTokenClient=null;
let driveAccessToken="";

function getDriveConfig(){return readJson(DRIVE_CFG_KEY,{clientId:"531999988443-kmg6n43gh2652gmun786jtgragr141bb.apps.googleusercontent.com",rootFolderId:""})}
function extractDriveFolderId(value){
  const text=String(value||"").trim();
  const m=text.match(/\/folders\/([a-zA-Z0-9_-]+)/);
  return m?m[1]:text;
}
function openDriveSettings(){
  const cfg=getDriveConfig();
  driveClientId.value=cfg.clientId||"";
  driveRootFolder.value=cfg.rootFolderId||"";
  driveSettingsModal.classList.remove("hidden");
}
function closeDriveSettings(){driveSettingsModal.classList.add("hidden")}
function saveDriveSettings(){
  const clientId=driveClientId.value.trim();
  const rootFolderId=extractDriveFolderId(driveRootFolder.value);
  if(!clientId||!rootFolderId){alert("יש להזין Client ID וקישור לתיקיית Lori Lab");return}
  writeJson(DRIVE_CFG_KEY,{clientId,rootFolderId});
  driveTokenClient=null; driveAccessToken=""; driveFolderCache.clear();
  closeDriveSettings();
  driveSyncStatus.textContent="הגדרת Drive נשמרה. כעת לחץ על סנכרון.";
}
function setDriveStatus(text,isError=false){
  driveSyncStatus.textContent=text;
  driveSyncStatus.style.color=isError?"#a61b1b":"";
}
function requestDriveToken(clientId){
  return new Promise((resolve,reject)=>{
    if(!window.google?.accounts?.oauth2){reject(new Error("רכיב ההתחברות של Google עדיין לא נטען. בדוק חיבור לאינטרנט."));return}
    driveTokenClient=google.accounts.oauth2.initTokenClient({
      client_id:clientId,
      scope:"https://www.googleapis.com/auth/drive",
      callback:resp=>{
        if(resp.error){
          const details=resp.error_description||resp.error;
          reject(new Error("התחברות Google נכשלה: "+details));
          return;
        }
        if(!resp.access_token){reject(new Error("Google לא החזירה הרשאת גישה ל־Drive."));return}
        resolve(resp.access_token);
      }
    });
    driveTokenClient.requestAccessToken({prompt:driveAccessToken?"":"select_account"});
  });
}
async function driveApi(url,options={}){
  const res=await fetch(url,{
    ...options,
    headers:{Authorization:"Bearer "+driveAccessToken,...(options.headers||{})}
  });
  if(res.status===401){
    driveAccessToken="";
    throw new Error("פג תוקף ההרשאה ל־Drive. נסה שוב ואשר התחברות.");
  }
  if(!res.ok){
    const t=await res.text();
    throw new Error("שגיאת Drive: "+res.status+" "+t.slice(0,220));
  }
  return res;
}
function driveEscapeQueryName(name){
  return String(name).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}
function normalizeDriveFolderName(value){
  return String(value||"")
    .normalize("NFKD")
    // הסרת סימני כיוון, תווים נסתרים, ניקוד ערבי/עברי וטטוויל.
    .replace(/[\u200B-\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/g,"")
    .replace(/[\u0591-\u05C7\u0610-\u061A\u0640\u064B-\u065F\u0670\u06D6-\u06ED]/g,"")
    // איחוד וריאציות נפוצות באותיות ערביות לצורך השוואת שמות בלבד.
    .replace(/[أإآٱ]/g,"ا")
    .replace(/[ى]/g,"ي")
    .replace(/[ؤ]/g,"و")
    .replace(/[ئ]/g,"ي")
    .replace(/ة/g,"ه")
    .replace(/\s+/g," ")
    .trim()
    .toLocaleLowerCase("ar");
}
const driveFolderCache=new Map();
const driveFolderPromises=new Map();
function driveFolderKey(parentId,name){
  return `${parentId}::${normalizeDriveFolderName(name)}`;
}
async function driveFindFolder(parentId,name){
  const wanted=normalizeDriveFolderName(name);
  let pageToken="";
  do{
    const params=new URLSearchParams({
      q:`'${parentId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`,
      fields:"nextPageToken,files(id,name,createdTime)",
      pageSize:"1000",
      orderBy:"createdTime",
      supportsAllDrives:"true",
      includeItemsFromAllDrives:"true"
    });
    if(pageToken) params.set("pageToken",pageToken);
    const res=await driveApi("https://www.googleapis.com/drive/v3/files?"+params);
    const data=await res.json();
    const matches=(data.files||[]).filter(file=>normalizeDriveFolderName(file.name)===wanted);
    if(matches.length){
      // אם כבר קיימות כפילויות ישנות, משתמשים תמיד בתיקייה הוותיקה ביותר.
      matches.sort((a,b)=>String(a.createdTime||"").localeCompare(String(b.createdTime||"")));
      return matches[0];
    }
    pageToken=data.nextPageToken||"";
  }while(pageToken);
  return null;
}
async function driveCreateFolder(parentId,name){
  const cleanName=String(name||"").normalize("NFC").replace(/\s+/g," ").trim();
  const res=await driveApi("https://www.googleapis.com/drive/v3/files?supportsAllDrives=true",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name:cleanName,mimeType:"application/vnd.google-apps.folder",parents:[parentId]})
  });
  return await res.json();
}
async function driveEnsureFolder(parentId,name){
  const key=driveFolderKey(parentId,name);
  if(driveFolderCache.has(key)) return driveFolderCache.get(key);
  if(driveFolderPromises.has(key)) return await driveFolderPromises.get(key);
  const promise=(async()=>{
    let folder=await driveFindFolder(parentId,name);
    if(!folder){
      folder=await driveCreateFolder(parentId,name);
      // בדיקה חוזרת מונעת כפילות במקרה ששתי שמירות התחילו כמעט יחד.
      const verified=await driveFindFolder(parentId,name);
      if(verified) folder=verified;
    }
    driveFolderCache.set(key,folder);
    return folder;
  })();
  driveFolderPromises.set(key,promise);
  try{return await promise}
  finally{driveFolderPromises.delete(key)}
}
async function driveFindPdf(parentId,name){
  const params=new URLSearchParams({
    q:`'${parentId}' in parents and name='${driveEscapeQueryName(name)}' and mimeType='application/pdf' and trashed=false`,
    fields:"files(id,name)",
    pageSize:"10",
    supportsAllDrives:"true",
    includeItemsFromAllDrives:"true"
  });
  const res=await driveApi("https://www.googleapis.com/drive/v3/files?"+params);
  const data=await res.json();
  return (data.files||[])[0]||null;
}
async function driveUploadPdf(parentId,filename,pdfBlob){
  const existing=await driveFindPdf(parentId,filename);
  const boundary="lori_lab_"+Date.now().toString(36);
  const metadata=existing ? {name:filename} : {name:filename,parents:[parentId]};
  const multipartBody=new Blob([
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`,
    JSON.stringify(metadata),
    `\r\n--${boundary}\r\nContent-Type: application/pdf\r\n\r\n`,
    pdfBlob,
    `\r\n--${boundary}--`
  ]);
  const url=existing
    ? `https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=multipart&supportsAllDrives=true`
    : "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true";
  const res=await driveApi(url,{
    method:existing?"PATCH":"POST",
    headers:{"Content-Type":"multipart/related; boundary="+boundary},
    body:multipartBody
  });
  return await res.json();
}
async function uploadCertificateToDrive(pdfBlob,filename,city,client,certificateDate,customerRecord=null){
  const cfg=getDriveConfig();
  if(!cfg.clientId || !cfg.rootFolderId) throw new Error("חסרה הגדרת Google Drive.");
  if(!navigator.onLine) throw new Error("אין חיבור לאינטרנט.");
  if(!driveAccessToken) driveAccessToken=await requestDriveToken(cfg.clientId);

  // ללקוח שסונכרן מ-Drive משתמשים ישירות במזהי התיקיות, ולא מחפשים לפי שם.
  let cityFolder = customerRecord?.driveCityFolderId ? {id:customerRecord.driveCityFolderId,name:city} : null;
  let clientFolder = customerRecord?.driveFolderId ? {id:customerRecord.driveFolderId,name:client} : null;
  if(!cityFolder) cityFolder=await driveEnsureFolder(cfg.rootFolderId,city);
  if(!clientFolder) clientFolder=await driveEnsureFolder(cityFolder.id,client);

  // שומרים את המזהים ברשומת הלקוח כדי שכל שמירה עתידית תגיע לאותה תיקייה בוודאות.
  if(customerRecord?.id && (!customerRecord.driveCityFolderId || !customerRecord.driveFolderId)){
    const customers=readJson(DB_KEYS.customers,[]);
    const idx=customers.findIndex(c=>c.id===customerRecord.id);
    if(idx>=0){
      customers[idx].driveCityFolderId=cityFolder.id;
      customers[idx].driveFolderId=clientFolder.id;
      writeJson(DB_KEYS.customers,customers);
    }
  }

  const dateFolder=await driveEnsureFolder(clientFolder.id,fDate(certificateDate));
  return await driveUploadPdf(dateFolder.id,filename,pdfBlob);
}

async function driveListFolders(parentId){
  const out=[]; let pageToken="";
  do{
    const params=new URLSearchParams({
      q:`'${parentId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`,
      fields:"nextPageToken,files(id,name)",
      pageSize:"1000",
      orderBy:"name",
      supportsAllDrives:"true",
      includeItemsFromAllDrives:"true"
    });
    if(pageToken)params.set("pageToken",pageToken);
    const res=await fetch("https://www.googleapis.com/drive/v3/files?"+params,{headers:{Authorization:"Bearer "+driveAccessToken}});
    if(res.status===401){driveAccessToken="";throw new Error("פג תוקף ההרשאה. לחץ שוב על סנכרון.")}
    if(!res.ok){const t=await res.text();throw new Error("שגיאת Drive: "+res.status+" "+t.slice(0,160))}
    const data=await res.json();out.push(...(data.files||[]));pageToken=data.nextPageToken||"";
  }while(pageToken);
  return out;
}
async function syncCustomersFromDrive(){
  const cfg=getDriveConfig();
  if(!cfg.clientId||!cfg.rootFolderId){openDriveSettings();return}
  if(!navigator.onLine){setDriveStatus("אין חיבור לאינטרנט. הרשימה המקומית עדיין זמינה.",true);return}
  try{
    setDriveStatus("מתחבר ל־Google Drive… אם מופיעה אזהרת Google, לחץ על המשך.");
    if(!driveAccessToken)driveAccessToken=await requestDriveToken(cfg.clientId);
    setDriveStatus("קורא ערים ולקוחות…");
    const allCities=await driveListFolders(cfg.rootFolderId);
    // במקרה שכבר יש כפילויות ישנות, משתמשים בתיקייה הוותיקה/הראשונה לכל שם מנורמל.
    const cityMap=new Map();
    for(const city of allCities){
      const key=normalizeDriveFolderName(city.name);
      if(!cityMap.has(key)) cityMap.set(key,city);
    }
    const cities=[...cityMap.values()];
    const imported=[];
    for(let i=0;i<cities.length;i++){
      const city=cities[i];
      setDriveStatus(`קורא ${city.name} (${i+1}/${cities.length})…`);
      const allClients=await driveListFolders(city.id);
      const clientMap=new Map();
      for(const c of allClients){
        const key=normalizeDriveFolderName(c.name);
        if(!clientMap.has(key)) clientMap.set(key,c);
      }
      for(const c of clientMap.values()) imported.push({city:city.name,name:c.name,driveCityFolderId:city.id,driveFolderId:c.id});
    }
    const existing=readJson(DB_KEYS.customers,[]);
    const byKey=new Map(existing.map((c,i)=>[normalizeDriveFolderName(c.city)+"\u0000"+normalizeDriveFolderName(c.name),i]));
    let added=0,linked=0;
    for(const x of imported){
      const key=normalizeDriveFolderName(x.city)+"\u0000"+normalizeDriveFolderName(x.name);
      const idx=byKey.get(key);
      if(idx===undefined){
        existing.push({id:uid(),city:x.city,name:x.name,phone:"",email:"",notes:"נוסף מ־Google Drive",favorite:false,driveImported:true,driveCityFolderId:x.driveCityFolderId,driveFolderId:x.driveFolderId});
        byKey.set(key,existing.length-1);added++;
      }else{
        if(existing[idx].driveCityFolderId!==x.driveCityFolderId || existing[idx].driveFolderId!==x.driveFolderId) linked++;
        existing[idx].driveCityFolderId=x.driveCityFolderId;
        existing[idx].driveFolderId=x.driveFolderId;
      }
    }
    writeJson(DB_KEYS.customers,existing);
    driveFolderCache.clear();
    localStorage.setItem("loriLabDriveLastSync",new Date().toISOString());
    refreshSelectors();renderCustomers();
    setDriveStatus(`הסנכרון הסתיים: נמצאו ${cities.length} ערים ו־${imported.length} לקוחות; נוספו ${added}, קושרו לתיקיות קיימות ${linked}.`);
  }catch(err){console.error(err);setDriveStatus(err.message||"הסנכרון נכשל",true)}
}
function showLastDriveSync(){
  const iso=localStorage.getItem("loriLabDriveLastSync");
  if(iso)driveSyncStatus.textContent="סנכרון אחרון: "+new Date(iso).toLocaleString("he-IL");
}

seedCustomers();refreshSelectors();redraw();showLastDriveSync();
</script>

<script>
/* Lori Lab v11.1 — עריכה ומחיקה של רשומות היסטוריה */
let editingHistoryId = null;

function ensureHistoryIds(){
  const rows = readJson(DB_KEYS.history, []);
  let changed = false;
  rows.forEach(r => {
    if(!r.id){ r.id = uid(); changed = true; }
  });
  if(changed) writeJson(DB_KEYS.history, rows);
}

function setHistoryEditMode(record=null){
  const title = document.querySelector("#certificateScreen .card h2");
  const saveBtn = [...document.querySelectorAll("#certificateScreen .actions button")]
    .find(b => b.getAttribute("onclick") === "saveRecord()");

  let banner = document.getElementById("historyEditBanner");
  if(!banner){
    banner = document.createElement("div");
    banner.id = "historyEditBanner";
    banner.className = "hidden";
    banner.style.cssText =
      "margin:0 0 14px;padding:12px;border:2px solid #c9a12d;border-radius:12px;" +
      "background:#fff8dd;color:#174b31;font-weight:700;line-height:1.5";
    title.insertAdjacentElement("afterend", banner);
  }

  if(record){
    title.textContent = "עריכת תעודה";
    if(saveBtn) saveBtn.textContent = "✅ שמור תיקון";
    banner.classList.remove("hidden");
    banner.innerHTML =
      `עריכת רשומה: <strong>${escapeHtml(record.identification || "ללא מספר זיהוי")}</strong><br>` +
      `<button type="button" class="secondary small" onclick="cancelHistoryEdit()" style="margin-top:8px">ביטול עריכה</button>`;
  }else{
    title.textContent = "תעודה חדשה";
    if(saveBtn) saveBtn.textContent = "📋 שמור ברשומות";
    banner.classList.add("hidden");
    banner.innerHTML = "";
  }
}

function currentRecord(){
  const c = readJson(DB_KEYS.customers, []).find(x => x.id === clientSelect.value);
  const old = editingHistoryId
    ? readJson(DB_KEYS.history, []).find(x => x.id === editingHistoryId)
    : null;

  return {
    id: editingHistoryId || uid(),
    date: date.value,
    city: citySelect.value || old?.city || "",
    client: c?.name || v("sender") || old?.client || "",
    owner: v("owner"),
    sender: v("sender"),
    type: v("birdType"),
    identification: v("idNumber"),
    description: v("description"),
    result: getSex() === "male" ? "זכר" : "נקבה",
    createdAt: old?.createdAt || new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
}

function saveCurrentRecord(showMessage=true){
  const r = currentRecord();

  if(!r.date){
    if(showMessage) alert("יש לבחור תאריך");
    return false;
  }
  if(!r.client){
    if(showMessage) alert("יש לבחור לקוח או למלא שם שולח");
    return false;
  }

  const list = readJson(DB_KEYS.history, []);

  if(editingHistoryId){
    const i = list.findIndex(x => x.id === editingHistoryId);
    if(i >= 0) list[i] = r;
    else list.unshift({...r, id:uid()});

    writeJson(DB_KEYS.history, list);
    editingHistoryId = null;
    setHistoryEditMode(null);
    if(showMessage) alert("התיקון נשמר בהצלחה");
    return true;
  }

  const duplicate = list.some(x =>
    x.date === r.date &&
    x.client === r.client &&
    x.identification === r.identification &&
    x.type === r.type &&
    x.description === r.description &&
    x.result === r.result
  );

  if(!duplicate){
    list.unshift(r);
    writeJson(DB_KEYS.history, list);
  }

  if(showMessage) alert(duplicate ? "הרשומה כבר קיימת" : "הרשומה נשמרה בטלפון");
  return true;
}

function saveRecord(){
  saveCurrentRecord(true);
}

function editHistoryRecord(id){
  const r = readJson(DB_KEYS.history, []).find(x => x.id === id);
  if(!r){
    alert("הרשומה לא נמצאה");
    renderHistory();
    return;
  }

  editingHistoryId = id;

  citySelect.value = r.city || "";
  loadClientsForCity();

  const customer = readJson(DB_KEYS.customers, []).find(c =>
    c.city === (r.city || "") && c.name === (r.client || "")
  );
  clientSelect.value = customer?.id || "";

  owner.value = r.owner || r.client || "";
  sender.value = r.sender || r.client || "";
  birdType.value = r.type || "";
  idNumber.value = r.identification || "";
  description.value = r.description || "";
  date.value = r.date || "";

  const sex = r.result === "זכר" ? "male" : "female";
  const radio = document.querySelector(`input[name="sex"][value="${sex}"]`);
  if(radio) radio.checked = true;

  setHistoryEditMode(r);
  redraw();
  switchScreen("certificateScreen");
  window.scrollTo({top:0, behavior:"smooth"});
}

function cancelHistoryEdit(){
  editingHistoryId = null;
  setHistoryEditMode(null);
  clearForm();
}

function deleteHistoryRecord(id){
  const list = readJson(DB_KEYS.history, []);
  const r = list.find(x => x.id === id);

  if(!r){
    alert("הרשומה כבר אינה קיימת");
    renderHistory();
    return;
  }

  const details = [r.identification, r.type, r.result].filter(Boolean).join(" · ");
  if(!confirm(`למחוק את הרשומה${details ? "\n" + details : ""}?\n\nהיא תוסר גם מהטבלאות ומקובץ CSV.`)) return;

  writeJson(DB_KEYS.history, list.filter(x => x.id !== id));

  if(editingHistoryId === id){
    editingHistoryId = null;
    setHistoryEditMode(null);
  }

  renderHistory();
  alert("הרשומה נמחקה מההיסטוריה ומהטבלאות");
}

function renderHistory(){
  ensureHistoryIds();

  const q = (historySearch.value || "").trim().toLowerCase();
  const list = readJson(DB_KEYS.history, [])
    .filter(r => [r.client,r.city,r.type,r.identification,r.description,r.result,r.date]
      .join(" ").toLowerCase().includes(q))
    .sort((a,b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));

  historyList.innerHTML = list.length
    ? list.map(r => `
      <div class="list-item">
        <div class="list-title">${escapeHtml(r.identification || "ללא מספר זיהוי")} · ${escapeHtml(r.result || "")}</div>
        <div class="list-sub">${escapeHtml(r.client || "")} · ${escapeHtml(r.city || "")} · ${escapeHtml(r.type || "")} · ${escapeHtml(r.date || "")}</div>
        <div class="list-sub">${escapeHtml(r.description || "")}</div>
        <div class="list-actions">
          <button class="secondary" onclick="editHistoryRecord('${r.id}')">✏️ עריכה</button>
          <button class="secondary" onclick="deleteHistoryRecord('${r.id}')">🗑️ מחיקה</button>
        </div>
      </div>`).join("")
    : '<div class="empty">אין עדיין רשומות</div>';
}

const originalClearFormV111 = clearForm;
clearForm = function(){
  editingHistoryId = null;
  setHistoryEditMode(null);
  originalClearFormV111();
};

ensureHistoryIds();
setHistoryEditMode(null);
</script>
